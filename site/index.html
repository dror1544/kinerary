<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script src="runtime-base.js"></script>
  <title>Family Trip</title>
  <style>
    :root {
      color: #10263a;
      background: #faf8f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }
    main {
      width: min(92vw, 420px);
      text-align: center;
    }
    .mark {
      display: inline-grid;
      width: 58px;
      height: 58px;
      margin-bottom: 18px;
      place-items: center;
      border-radius: 18px;
      color: #fff;
      background: #0e8f86;
      font-weight: 800;
      box-shadow: 0 16px 40px rgba(16, 38, 58, .16);
    }
    p {
      margin: 0;
      color: #405363;
      line-height: 1.6;
    }
    a {
      color: #0e8f86;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">K</div>
    <p id="status">Opening your trip...</p>
    <p><a id="fallback" href="classic.html" hidden>Open Classic</a></p>
  </main>
  <div class="hero-countdown" id="hero-countdown" hidden>
    <div class="cd-caption" id="cd-caption"></div>
    <div class="cd-units" id="cd-units">
      <div class="cu"><strong id="cd-d">-</strong><small data-i18n="cd_days">days</small></div>
      <div class="cu-sep">/</div>
      <div class="cu"><strong id="cd-h">-</strong><small data-i18n="cd_hours">hours</small></div>
      <div class="cu-sep">/</div>
      <div class="cu"><strong id="cd-m">-</strong><small data-i18n="cd_min">minutes</small></div>
      <div class="cu-sep">/</div>
      <div class="cu"><strong id="cd-s">-</strong><small data-i18n="cd_sec">seconds</small></div>
    </div>
    <div class="cd-live" id="cd-live" hidden>
      <div class="cd-live-text">
        <strong class="cd-live-phase" id="cd-live-phase"></strong>
        <small class="cd-live-day" id="cd-live-day"></small>
      </div>
      <span class="cd-live-arrow" id="cd-live-arrow" aria-hidden="true"></span>
    </div>
    <div class="cd-finished" id="cd-finished" hidden></div>
  </div>
  <script>
    const runtimePath = window.runtimePath || ((p) => p);
    const samePrefix = (target) => runtimePath(target).replace(/\/index\.html$/, "/");
    const fallback = document.getElementById("fallback");
    const status = document.getElementById("status");

    async function chooseExperience() {
      try {
        const response = await fetch(runtimePath("/api/ui-bootstrap"), { cache: "no-store" });
        if (!response.ok) throw new Error("bootstrap failed");
        const data = await response.json();
        const route = data.design_variant === "modern" ? data.routes?.modern || "/modern/" : data.routes?.classic || "/classic.html";
        window.location.replace(samePrefix(route));
      } catch (error) {
        status.textContent = "Classic is ready if the modern shell cannot load.";
        fallback.hidden = false;
        fallback.href = samePrefix("/classic.html");
      }
    }

    chooseExperience();
  </script>
</body>
</html>
