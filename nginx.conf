server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SSE endpoints — must not be buffered
  location ~ ^/api/trivia/(events|public-events) {
    proxy_pass http://trip-server:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
  }

  location /api/ {
    proxy_pass http://trip-server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    client_max_body_size 500m;
  }

  location /photo/ {
    proxy_pass http://trip-server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Documents may contain booking confirmations and other private trip data.
  # Never let Nginx read them from disk: Express authenticates every request.
  location ^~ /confirmations/ {
    proxy_pass http://trip-server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ~* \.(md|txt|rtf|pdf|doc|docx|xls|xlsx|ppt|pptx|odt|ods|odp|pkpass)$ {
    proxy_pass http://trip-server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
