# The main nginx config of the trip-site image. The site itself is the ONE shared
# server block, provisioning/trip-site-nginx.conf, that an LXC trip also uses: this
# file only makes nginx able to run as an arbitrary non-root uid with nothing
# writable but /tmp, and sends its logs to the container's.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  # The site accepts uploads of up to 500m (see the shared server block); spool them
  # under /tmp, the only place a non-root, read-only container can write.
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  include /etc/nginx/trip-site.conf;
}
