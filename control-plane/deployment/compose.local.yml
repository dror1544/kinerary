name: kinerary-control-plane-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kinerary_control_plane
      POSTGRES_USER: kinerary_control_plane
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - control_plane_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinerary_control_plane -d kinerary_control_plane"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [private]

  migrate:
    build:
      context: ../..
      dockerfile: control-plane/api/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      # Resolves database.connection_secret_ref from the same profile the API
      # uses, so both cannot end up pointed at different databases.
      CONTROL_PLANE_ARCHITECTURE_PROFILE: /run/config/architecture.json
      CONTROL_PLANE_MIGRATIONS_DIR: /app/migrations
    secrets: [control_plane_database_url]
    configs:
      - source: architecture_profile
        target: /run/config/architecture.json
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [private]

  api:
    build:
      context: ../..
      dockerfile: control-plane/api/Dockerfile
    environment:
      CONTROL_PLANE_ARCHITECTURE_PROFILE: /run/config/architecture.json
    # The secret is still mounted: the profile's file:// database reference
    # resolves to this path.
    secrets: [control_plane_database_url, telegram_creds, approval_signing_key, telegram_webhook_secret, telegram_super_admin_chat_id]
    configs:
      - source: architecture_profile
        target: /run/config/architecture.json
    ports:
      - "${CONTROL_PLANE_BIND_IP:-127.0.0.1}:4310:4310"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [ingress, private]

  worker:
    build: ../worker
    command: ["python", "-m", "control_plane_worker", "run", "--poll-seconds", "10"]
    environment:
      CONTROL_PLANE_DATABASE_URL_FILE: /run/secrets/control_plane_database_url
    secrets: [control_plane_database_url]
    healthcheck:
      test: ["CMD", "python", "-m", "control_plane_worker", "check-database"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [private]

secrets:
  postgres_password:
    file: ./.local-secrets/postgres_password
  control_plane_database_url:
    file: ./.local-secrets/control_plane_database_url
  telegram_creds:
    file: ./.local-secrets/telegram_creds
  approval_signing_key:
    file: ./.local-secrets/approval_signing_key
  telegram_webhook_secret:
    file: ./.local-secrets/telegram_webhook_secret
  telegram_super_admin_chat_id:
    file: ./.local-secrets/telegram_super_admin_chat_id

configs:
  architecture_profile:
    file: ../config/architecture.local.example.json

volumes:
  control_plane_postgres_data:

networks:
  ingress: {}
  private: {}
