# This file is an nginx TEMPLATE: the nginx image runs envsubst over /etc/nginx/templates at
# start (web/Dockerfile installs it there). Only the variables named in NGINX_ENVSUBST_FILTER
# are substituted, so nginx's own $variables are left alone.
#   CONTROL_PLANE_API_ORIGIN  where /v1 goes (http://host:port, no path) - set by the deployment
#   NGINX_LOCAL_RESOLVERS     the container's own DNS servers, read from /etc/resolv.conf by the image
# To check a rendering: docs/control-plane-vm-deployment.md, "Organizer portal and runtime gateway".
server {
  listen 80;
  server_name _;
  # The launch form posts to the trip site, which accepts it only with Origin set to this
  # portal. A stricter policy (no-referrer) would turn that Origin into "null". nginx drops
  # server-level add_header in any location that has its own, so it is repeated below.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  root /usr/share/nginx/html;
  index index.html;

  # FRAMING. Nothing here may be framed by another site (clickjacking: the
  # portal is a signed-in surface) EXCEPT the Telegram Mini App, which Telegram
  # Web (web.telegram.org) runs inside an iframe — see the two /mini-app
  # locations below. `frame-ancestors` is the modern control; X-Frame-Options
  # is for browsers that predate it. nginx does NOT inherit add_header into a
  # location that has an add_header of its own, so every location that adds a
  # header restates these two (the framing test in web/src/framing.test.ts
  # fails if one forgets).
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;

  # The API's address is a variable and the resolver is the container's own, so nginx looks
  # the name up again as the answer expires. A literal proxy_pass resolves ONCE at start and
  # keeps the old address when the API container is recreated (every upgrade does that),
  # answering 502 until the portal is restarted too. With a variable and no URI part the
  # request URI is passed upstream unchanged.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

  location /v1/ {
    set $control_plane_api "${CONTROL_PLANE_API_ORIGIN}";
    proxy_pass $control_plane_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The pattern is QUOTED on purpose: unquoted, nginx reads the `{` of `{8,}` as the start of
  # the location block and refuses to start ("unknown directive") - issue #441.
  # tests/scripts/test_vm_web_profile.py fails if it is ever unquoted again.
  location ~* "/assets/.*-[A-Za-z0-9_-]{8,}\.(js|css|svg|woff2)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # The Mini App, and ONLY the Mini App (/mini-app and everything under it), may
  # be framed — and only by Telegram's web clients. Telegram Web runs a Mini
  # App in a cross-site iframe; its session cookie is the partitioned
  # SameSite=None variant (portal.ts). No X-Frame-Options here on purpose: it
  # cannot name an allowed origin, and DENY/SAMEORIGIN would cancel the line
  # below in every browser that honours both.
  #
  # These are named-location fallbacks, not `try_files ... /index.html`: that
  # fallback is an internal redirect to `location = /index.html`, whose headers
  # (frame-ancestors 'none') would then win and Telegram Web would show a blank
  # frame. `rewrite ... break` serves the file from THIS location instead.
  location = /mini-app {
    try_files $uri @mini_app_shell;
  }
  location ^~ /mini-app/ {
    try_files $uri @mini_app_shell;
  }
  location @mini_app_shell {
    rewrite ^ /index.html break;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://webk.telegram.org https://webz.telegram.org" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # SIGN IN WITH GOOGLE (Google Identity Services), on the two pages that draw its button and no others. The page
  # loads https://accounts.google.com/gsi/client, Google draws the button in a frame, and the popup's result comes
  # back through that script, so the document needs script, frame, connect and style access to exactly the paths
  # Google documents for it. Everywhere else the policy stays frame-ancestors only and does not mention Google.
  #
  # The rest of this policy is what these pages already use, written down so that naming Google makes it tighter
  # than before and not looser: scripts are this origin's own (the build has no inline script), the API is this
  # origin's /v1, and styles are this origin's, React's inline style attributes and the font stylesheet the CSS imports.
  # An SPA holds the policy of the document it was LOADED as, not of the page it has navigated to, so a visitor who
  # reaches /sign-in from the landing page by the router keeps the landing page's policy (which restricts nothing
  # here) and a direct load gets this one. Both work; only this one names Google.
  #
  # Same shape as the Mini App shell above, for the same reason: a `try_files ... /index.html` fallback is an
  # internal redirect to `location = /index.html`, whose headers would win; `rewrite ... break` serves the file from
  # the named location. No frame-ancestors loosening: these pages are not framable, and the button is not drawn
  # inside the Mini App (Google's popup cannot open there).
  location = /sign-in {
    try_files $uri @google_sign_in_shell;
  }
  location = /sign-up {
    try_files $uri @google_sign_in_shell;
  }
  location @google_sign_in_shell {
    rewrite ^ /index.html break;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy "frame-ancestors 'none'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
