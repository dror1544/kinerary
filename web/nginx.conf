server {
  listen 80;
  server_name _;
  # The launch form posts to the trip site, which accepts it only with Origin set to this
  # portal. A stricter policy (no-referrer) would turn that Origin into "null". nginx drops
  # server-level add_header in any location that has its own, so it is repeated below.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  root /usr/share/nginx/html;
  index index.html;

  location /v1/ {
    proxy_pass http://control-plane-api:4310;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* /assets/.*-[A-Za-z0-9_-]{8,}\.(js|css|svg|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
