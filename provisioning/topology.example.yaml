# Copy to a private path, substitute all ${...} values through your environment,
# then run: python3 -m provisioning plan --topology /private/topology.yaml
version: 1
name: ${ONBOARDING_NAME}
proxmox:
  node: ${PROXMOX_NODE}
  lxc:
    name: ${LXC_NAME}
    template: ${PROXMOX_LXC_TEMPLATE}
    storage: ${PROXMOX_STORAGE}
    cores: 2
    memory_mb: 2048
    disk_gb: 16
    bridge: ${PROXMOX_BRIDGE}
    ipv4: dhcp
    gateway: ${PROXMOX_GATEWAY}
    nameserver: ${PROXMOX_NAMESERVER}
    nfs_host_dir: ${NFS_HOST_DIR}
    nfs_mount_path: ${NFS_MOUNT_PATH}
npm:
  hostname: ${PUBLIC_HOSTNAME}
  forward_host: ${LXC_NAME}
  forward_port: 8080
cloudflare:
  tunnel_id: ${CLOUDFLARE_TUNNEL_ID}
  hostname: ${PUBLIC_HOSTNAME}
  service: ${CLOUDFLARE_TUNNEL_SERVICE}

# Wildcard routing (TRIP_ROUTING=wildcard in the control-plane worker): no
# proxy host, no DNS record, no tunnel rule - delete the `npm:` and `cloudflare:`
# sections above, add `routing: wildcard` under `name:`, and give the container's
# own section the two things those sections carried:
#
#   routing: wildcard
#   proxmox:
#     lxc:
#       forward_port: 8080                  # where the site listens in the container
#       public_hostname: ${PUBLIC_HOSTNAME} # sent to the runtime gateway by a wildcard record
#
# A file with no `routing:` line is `host`, as every file written before it was.
