# Copy to a private path, substitute all ${...} values through your environment,
# then run: python3 -m provisioning plan --topology /private/topology.yaml
version: 1
name: ${ONBOARDING_NAME}
proxmox:
  node: ${PROXMOX_NODE}
  lxc:
    name: ${LXC_NAME}
    template: ${PROXMOX_LXC_TEMPLATE}
    storage: ${PROXMOX_STORAGE}
    cores: 2
    memory_mb: 2048
    disk_gb: 16
    bridge: ${PROXMOX_BRIDGE}
    ipv4: dhcp
    gateway: ${PROXMOX_GATEWAY}
    nameserver: ${PROXMOX_NAMESERVER}
    nfs_host_dir: ${NFS_HOST_DIR}
    nfs_mount_path: ${NFS_MOUNT_PATH}
npm:
  hostname: ${PUBLIC_HOSTNAME}
  forward_host: ${LXC_NAME}
  forward_port: 8080
cloudflare:
  tunnel_id: ${CLOUDFLARE_TUNNEL_ID}
  hostname: ${PUBLIC_HOSTNAME}
  service: ${CLOUDFLARE_TUNNEL_SERVICE}
